<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with Safe Padding for Maskable Icons -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Quantum Orbits -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyanIndigo)" stroke-width="8" stroke-dasharray="16 12" opacity="0.4"/>
  <ellipse cx="256" cy="256" rx="180" ry="80" fill="none" stroke="url(#purplePink)" stroke-width="6" opacity="0.5" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="80" fill="none" stroke="url(#cyanIndigo)" stroke-width="6" opacity="0.5" transform="rotate(30 256 256)"/>

  <!-- Core Quantum Hub -->
  <circle cx="256" cy="256" r="54" fill="#1e1b4b" stroke="url(#cyanIndigo)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Center Quantum Node -->
  <circle cx="256" cy="256" r="24" fill="url(#cyanIndigo)"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>

  <!-- Orbital Particles -->
  <circle cx="256" cy="96" r="16" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="256" cy="416" r="16" fill="#818cf8"/>
  <circle cx="106" cy="200" r="14" fill="#a855f7"/>
  <circle cx="406" cy="312" r="14" fill="#ec4899"/>
</svg>
